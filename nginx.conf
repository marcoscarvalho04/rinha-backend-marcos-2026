worker_processes auto;
worker_rlimit_nofile 500000;

events {
    # Usa o epoll, que é a API de rede de altíssima performance do Linux
    use epoll;
    
    # Permite milhares de conexões simultâneas por worker
    worker_connections 10000;
    
    # Faz o worker aceitar todas as novas conexões de uma vez
    multi_accept on;
}

http {
    # Desligar logs de acesso para poupar CPU e Disco
    access_log off;
    error_log /dev/null emerg;

    # Otimizações de TCP
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Define o nosso cluster de APIs em Go
    upstream rinha_api {
        server unix:/run/api01/api.sock;
        server unix:/run/api02/api.sock;
        keepalive 500;
    }

    server {
        listen 9999;

        location / {
            proxy_pass http://rinha_api;
            
            # Necessário para que o keepalive do upstream funcione perfeitamente
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Evita timeouts se o Gatling demorar para enviar o payload
            proxy_read_timeout 10s;
            proxy_connect_timeout 5s;
        }
    }
}